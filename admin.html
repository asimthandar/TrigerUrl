<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>BERLIN X PANEL — Admin Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08111f;--bg-2:#0b1626;--panel:rgba(14,28,47,.88);--panel-solid:#0e1a2c;--panel-soft:#122139;
  --line:#203751;--line-2:#29425e;--text:#f5f8fc;--muted:#9aabc1;--soft:#6f829b;
  --primary:#8b5cf6;--primary-2:#c058ff;--cyan:#43b4ff;--green:#22c55e;--amber:#f59e0b;--red:#fb5a73;
  --shadow:0 22px 55px rgba(0,0,0,.28);--radius:18px;--sidebar:258px;--topbar:76px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:"Fira Sans",Inter,system-ui,sans-serif;color:var(--text);background:
 radial-gradient(700px 380px at 15% -5%,rgba(139,92,246,.16),transparent 70%),
 radial-gradient(620px 320px at 85% 0%,rgba(67,180,255,.09),transparent 65%),
 linear-gradient(160deg,#07111f,#091422 45%,#08111f);}
button,input,select{font:inherit}
button{cursor:pointer}
svg{display:block;overflow:visible}
.icon{width:20px;height:20px;display:inline-grid;place-items:center;flex:0 0 20px}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px;color:var(--soft)}
.btn{min-height:44px;border:1px solid var(--line-2);background:#132238;color:#dfe8f4;border-radius:12px;padding:0 15px;display:inline-flex;gap:9px;align-items:center;justify-content:center;font-weight:700;transition:.18s ease}
.btn:hover{transform:translateY(-1px);border-color:#416184;background:#182943}
.btn:focus-visible,.nav-btn:focus-visible,.field:focus-visible{outline:3px solid rgba(67,180,255,.28);outline-offset:2px}
.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 12px 26px rgba(139,92,246,.18)}
.btn.danger{border-color:rgba(251,90,115,.25);background:rgba(251,90,115,.08);color:#ff8ca0}
.btn.success{border-color:rgba(34,197,94,.24);background:rgba(34,197,94,.08);color:#74e7a0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.badge:before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.badge.green{background:rgba(34,197,94,.11);color:#63df93}.badge.blue{background:rgba(67,180,255,.11);color:#75c7ff}.badge.amber{background:rgba(245,158,11,.11);color:#f6c669}.badge.red{background:rgba(251,90,115,.11);color:#ff879b}.badge.purple{background:rgba(139,92,246,.13);color:#c29cff}
/* Login */
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(600px 400px at 50% 0,rgba(139,92,246,.14),transparent 70%)}
.login{width:min(430px,100%);background:rgba(12,24,42,.92);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}
.brand-mark{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4ca2,#8b5cf6);box-shadow:0 18px 35px rgba(139,92,246,.23);margin-bottom:18px}.brand-mark svg{width:31px;height:31px;fill:none;stroke:#fff;stroke-width:1.7}
.login h1{margin:0;font-size:28px;letter-spacing:-.03em}.login p{margin:7px 0 24px;color:var(--muted)}
.field-wrap{margin:15px 0}.field-wrap label{display:block;margin:0 0 8px;color:#cad6e6;font-size:13px;font-weight:700}.field{width:100%;height:48px;border:1px solid var(--line-2);background:#091626;color:#f5f8fc;border-radius:12px;padding:0 14px;outline:none}.field:focus{border-color:#6f66d5;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.err{min-height:20px;margin-top:11px;color:#ff8b9d;font-size:13px}
/* App shell */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid rgba(42,64,88,.7);background:rgba(7,16,29,.82);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:30}.brand{height:var(--topbar);display:flex;align-items:center;gap:11px;padding:0 19px;border-bottom:1px solid rgba(35,53,76,.75)}
.brand-icon{width:41px;height:41px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4ca2,#8b5cf6);box-shadow:0 12px 27px rgba(139,92,246,.23)}.brand-icon svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.7}.brand-copy strong{display:block;font-size:17px;letter-spacing:-.03em}.brand-copy strong span{color:#c76bff}.brand-copy small{display:block;color:#8395ae;font-size:11px;margin-top:2px}
.nav{padding:14px 10px;display:grid;gap:4px}.nav-btn{height:46px;border:0;background:transparent;color:#99a9be;border-radius:11px;padding:0 13px;display:flex;align-items:center;gap:11px;text-align:left}.nav-btn:hover{background:#0f1d30;color:#edf3fa}.nav-btn.active{background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(192,88,255,.09));color:#fff;box-shadow:inset 3px 0 0 var(--primary-2)}.nav-btn.active .icon{color:#df9bff}
.side-foot{margin-top:auto;padding:14px 16px 18px;color:#7e90a8;font-size:11px;line-height:1.6}.side-card{padding:13px;border:1px solid #1e344e;background:#0b1728;border-radius:14px;margin-bottom:12px}.side-card strong{display:block;color:#ecf2f8;font-size:13px;margin-bottom:8px}.bar{height:7px;background:#15263b;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef4ca2,#8b5cf6);border-radius:inherit;transition:width .25s ease}
/* Main */
.main{min-width:0}.topbar{height:var(--topbar);position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 23px;border-bottom:1px solid rgba(35,53,76,.72);background:rgba(7,16,29,.76);backdrop-filter:blur(16px)}.menu{display:none;background:transparent;border:0;color:#d5dfeb}.search-wrap{position:relative;width:min(530px,54vw)}.search-wrap .icon{position:absolute;left:13px;top:12px;color:#72859f}.search{width:100%;height:44px;border-radius:12px;border:1px solid #223954;background:#0c1829;color:#eef4fb;padding:0 15px 0 41px;outline:none}.search:focus{border-color:#4d6e96;box-shadow:0 0 0 3px rgba(67,180,255,.08)}.top-spacer{flex:1}.theme-btn,.profile-btn,.icon-btn{height:42px;border:1px solid #22374f;background:#102035;color:#b6c4d7;border-radius:12px;display:grid;place-items:center}.theme-btn{width:76px;border-radius:999px;display:flex;justify-content:space-between;padding:0 7px 0 10px}.theme-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#5fb6ff;color:#07111f}.theme-dot svg{width:16px;height:16px}.notice{position:relative}.notice .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#f0555b;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}.profile-btn{height:44px;padding:0 10px 0 6px;display:flex;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9d56ff,#6234d6);font-weight:800;color:#fff}.profile-copy b{display:block;font-size:13px;color:#edf2f8}.profile-copy small{display:block;color:#8395ac;font-size:10px;margin-top:1px}
.content{padding:22px 23px 34px;max-width:1540px;margin:auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.page-head h1{margin:0;font-size:28px;letter-spacing:-.04em}.page-head p{margin:5px 0 0;color:var(--muted)}.head-meta{text-align:right;color:#c6d1de;font-size:13px}.head-meta small{display:block;color:#788ba3;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(15,29,48,.92),rgba(9,18,31,.92));border-radius:16px;box-shadow:0 13px 40px rgba(0,0,0,.10)}.metric{min-height:132px;padding:18px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-60px;top:-65px;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%)}.metric.purple{border-color:#3c2d68;background:linear-gradient(145deg,rgba(54,33,115,.85),rgba(11,23,39,.97))}.metric.blue{border-color:#234c7c;background:linear-gradient(145deg,rgba(20,62,112,.83),rgba(10,23,40,.97))}.metric.green{border-color:#1d5f53;background:linear-gradient(145deg,rgba(8,70,59,.82),rgba(8,28,38,.97))}.metric.pink{border-color:#5b315b;background:linear-gradient(145deg,rgba(88,34,79,.82),rgba(16,23,40,.97))}.metric-top{display:flex;align-items:center;gap:11px}.metric-icon{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.11);display:grid;place-items:center;color:#fff}.metric-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}.metric label{font-size:13px;color:#d8e1ec}.metric b{display:block;font-size:29px;line-height:1;margin:12px 0 5px;letter-spacing:-.04em}.metric span{font-size:11px;color:#a8b7c9}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:16px;margin-bottom:18px}.panel{border:1px solid var(--line);background:rgba(10,20,35,.9);border-radius:16px;overflow:hidden;box-shadow:0 13px 40px rgba(0,0,0,.12)}.panel-head{min-height:62px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #1a2c42}.title{display:flex;align-items:center;gap:10px}.title h2{margin:0;font-size:15px}.title .mini{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#5e39d2,#a14cff);color:#fff}.title .mini svg{width:18px;height:18px}.link-btn{border:0;background:transparent;color:#bf7bff;font-size:12px;font-weight:700}.chart{height:250px;padding:13px 16px}.chart svg{width:100%;height:100%}.activity{padding:6px 16px 10px}.activity-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #182b40}.activity-row:last-child{border-bottom:0}.activity-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#122d2a;color:#62e1a2}.activity-icon svg{width:17px;height:17px}.activity-main b{font-size:12px}.activity-main small{display:block;color:#8294aa;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px}.activity-time{font-size:10px;color:#7f90a7;white-space:nowrap}
.lower{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px 13px;text-align:left;border-bottom:1px solid #182c42;font-size:11px}.table th{color:#7f92aa;text-transform:uppercase;letter-spacing:.06em;background:#0d1a2d;font-size:9px}.table td{color:#dce4ee}.table .strong{font-weight:700;color:#eff4fa}.meta{display:block;color:#8192a9;margin-top:3px;font-size:10px}.empty{padding:34px 15px;text-align:center;color:#8192a9}
/* Data views */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.view-head h2{margin:0;font-size:23px;letter-spacing:-.03em}.view-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{height:42px;border:1px solid var(--line-2);background:#0c192b;color:#eaf0f8;border-radius:11px;padding:0 12px;outline:none}.toolbar input{min-width:230px}.toolbar input:focus,.toolbar select:focus{border-color:#4c6b91}.table-card{overflow:hidden}.action svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}.action{width:38px;height:38px;border:1px solid #29415e;background:#112238;color:#c3d1e1;border-radius:10px;display:inline-grid;place-items:center;margin-right:5px}.action:hover{border-color:#557a9f;color:#fff}.action.danger{color:#ff8296;border-color:rgba(251,90,115,.24)}
/* Bulk */
.bulk-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px}.bulk-card{padding:18px}.drop{border:1px dashed #3a5675;background:#0a1728;border-radius:15px;padding:19px;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.drop.drag{border-color:#9b72ff;background:#101d33}.drop .big{width:50px;height:50px;border-radius:15px;background:rgba(139,92,246,.12);display:grid;place-items:center;color:#bb8cff;margin-bottom:10px}.drop .big svg{width:25px;height:25px}.drop h3{margin:0;font-size:15px}.drop p{margin:6px 0 12px;color:#8294ab;font-size:11px;line-height:1.45;max-width:430px}.drop input{display:none}.format-box{margin-top:13px;padding:11px 12px;border:1px solid #1e344d;border-radius:12px;background:#0b1626;font:11px/1.65 "Fira Code",monospace;color:#b9c8da;word-break:break-all}.bulk-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pair-preview{margin-top:14px;max-height:175px;overflow:auto;border:1px solid #1d324a;border-radius:13px}.pair-row{display:grid;grid-template-columns:1fr 170px;gap:12px;padding:10px 11px;border-bottom:1px solid #182b40;font-size:11px}.pair-row:last-child{border-bottom:0}.pair-row span:first-child{word-break:break-all;color:#dce6f1}.pair-row span:last-child{color:#7e90a8;text-align:right}.note{margin-top:12px;padding:10px 12px;border:1px solid #294260;border-radius:12px;background:#0c1a2d;color:#91a3ba;font-size:11px;line-height:1.5}.jobs{display:grid;gap:10px}.job{padding:13px;border:1px solid #1d334c;background:#0b1728;border-radius:13px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.job b{font-size:12px}.job small{display:block;color:#7f91a9;font-size:10px;margin-top:4px}.job-right{text-align:right}.status-pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.status-pill.pending{background:rgba(245,158,11,.1);color:#f5c56f}.status-pill.processing{background:rgba(67,180,255,.1);color:#7cc8ff}.status-pill.completed{background:rgba(34,197,94,.1);color:#6ee3a0}.status-pill.failed,.status-pill.cancelled{background:rgba(251,90,115,.1);color:#ff879b}.bulk-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:15px 0}.bulk-stat{padding:13px;border:1px solid #1e344d;background:#0b1728;border-radius:12px}.bulk-stat label{display:block;font-size:9px;color:#7e91a8;text-transform:uppercase;letter-spacing:.07em}.bulk-stat strong{display:block;margin-top:6px;font-size:19px}.progress{height:9px;background:#15273d;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef4ca2,#8b5cf6,#43b4ff);transition:width .24s ease}.results{overflow:auto;border:1px solid #1d334c;border-radius:13px}.results .table{min-width:780px}.url{max-width:450px;word-break:break-all}.success-text{color:#63df95;font-weight:700}.warn-text{color:#f5c56f;font-weight:700}.error-text{color:#ff879b;font-weight:700}
/* Drawer */
.drawer{position:fixed;inset:0;display:grid;grid-template-columns:1fr min(500px,94vw);background:rgba(1,8,15,.56);backdrop-filter:blur(8px);z-index:80;opacity:0;pointer-events:none;transition:.18s ease}.drawer.show{opacity:1;pointer-events:auto}.drawer-panel{height:100%;background:#0b1728;border-left:1px solid #29415e;box-shadow:-25px 0 70px rgba(0,0,0,.35);padding:20px;overflow:auto;transform:translateX(20px);transition:.18s ease}.drawer.show .drawer-panel{transform:none}.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.drawer-top h3{margin:0;font-size:18px}.detail{display:grid;gap:10px}.detail-row{padding:12px;border:1px solid #1c334d;background:#0d1b2f;border-radius:12px}.detail-row label{display:block;color:#7f92aa;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.detail-row div{color:#e7eef6;font-size:12px;word-break:break-word}
.toast{position:fixed;right:18px;bottom:18px;z-index:120;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border:1px solid #31506e;border-radius:12px;background:#0d1d30;color:#e7eef6;box-shadow:var(--shadow);transform:translateY(15px);opacity:0;pointer-events:none;transition:.2s ease;font-size:12px}.toast.show{transform:none;opacity:1}.toast.error{border-color:#63313d;color:#ffd2d8}.toast.success{border-color:#2a5d49;color:#b9f0cd}
/* Light */
.light body{background:#f4f7fb}.light .sidebar,.light .topbar{background:#f8fafc;border-color:#d9e1eb}.light .nav-btn{color:#6d7c90}.light .nav-btn:hover{background:#edf2f7;color:#182334}.light .nav-btn.active{color:#5b2fb3;background:linear-gradient(90deg,#efe7ff,#f7f2ff);box-shadow:inset 3px 0 #8b5cf6}.light .side-card{background:#fff;border-color:#dbe3ec}.light .side-card strong{color:#223047}.light .content{color:#172236}.light .page-head p,.light .view-head p{color:#6f7e91}.light .card,.light .panel,.light .table-card{background:#fff;border-color:#dbe3ec;box-shadow:0 12px 32px rgba(32,50,72,.06)}.light .metric{color:#1a2638}.light .metric label{color:#4a5970}.light .metric span{color:#68788d}.light .panel-head,.light .table th{border-color:#e3e8ef;background:#f8fafc}.light .table td{color:#304056;border-color:#e7edf3}.light .strong{color:#162236}.light .small,.light .meta{color:#7f8da1}.light .activity-row{border-color:#e8edf3}.light .bulk-card{background:#fff;border-color:#dbe3ec}.light .drop,.light .format-box,.light .note,.light .pair-preview,.light .job,.light .results,.light .bulk-stat{background:#f8fafc;border-color:#dce5ef}.light .drop p,.light .note,.light .job small{color:#6d7f94}.light .toolbar input,.light .toolbar select,.light .search,.light .field{background:#fff;color:#152238;border-color:#cbd6e3}.light .btn{background:#fff;border-color:#cbd7e5;color:#344359}.light .btn.primary{color:#fff;border-color:transparent}.light .drawer{background:rgba(25,38,55,.22)}.light .drawer-panel{background:#fff;border-color:#d8e1eb}.light .detail-row{background:#f8fafc;border-color:#dde6ef}.light .detail-row div{color:#1f2d40}.light .theme-btn,.light .profile-btn,.light .icon-btn{background:#fff;color:#526278;border-color:#cbd6e3}
@media(max-width:1100px){:root{--sidebar:228px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lower,.grid,.bulk-grid{grid-template-columns:1fr}.search-wrap{width:min(430px,48vw)}}
@media(max-width:760px){:root{--topbar:68px}.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-102%);transition:.2s ease;box-shadow:20px 0 60px rgba(0,0,0,.26)}.sidebar.open{transform:none}.menu{display:grid;place-items:center;width:40px;height:40px;border-radius:10px}.menu:hover{background:#102035}.search-wrap{width:100%}.topbar{padding:0 12px}.profile-copy{display:none}.content{padding:18px 12px 26px}.cards{grid-template-columns:1fr}.page-head{align-items:flex-start}.head-meta{display:none}.toolbar input{min-width:0;flex:1}.bulk-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pair-row{grid-template-columns:1fr}.pair-row span:last-child{text-align:left}.drawer{grid-template-columns:1fr}.drawer-panel{grid-column:1}.theme-btn{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true">
<defs>
<symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></g></symbol>

<script>
const $=(s)=>document.querySelector(s), $$=(s)=>Array.from(document.querySelectorAll(s));
let apps=[],connections=[],stats={},view='dashboard',bulkTimer=null,currentJob=null;
const api=async (url,opts={})=>{const r=await fetch(url,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=(n)=>{n=Number(n||0);if(n<1024)return `${n} B`;if(n<1024**2)return `${(n/1024).toFixed(1)} KB`;if(n<1024**3)return `${(n/1024**2).toFixed(1)} MB`;return `${(n/1024**3).toFixed(2)} GB`};
function toast(msg,type=''){const t=$('#toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200)}
function navTo(v){view=v;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#sidebar').classList.remove('open');renderView()}
function setHeader(title,sub){return `<div class="view-head"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div></div>`}
function metric(label,value,sub,kind,icon){return `<article class="card metric ${kind}"><div class="metric-top"><div class="metric-icon"><svg><use href="#${icon}"/></svg></div><label>${esc(label)}</label></div><b>${esc(value)}</b><span>${esc(sub)}</span></article>`}
function statusBadge(s){const x=String(s||'').toLowerCase();let k=x==='completed'||x==='active'||x==='reachable'?'green':x==='processing'||x==='auth_required'?'blue':x==='pending'||x==='not_found'?'amber':'red';return `<span class="badge ${k}">${esc(s||'unknown')}</span>`}
function renderDashboard(){
 const recentApps=apps.filter(x=>x.apk_stored_name).slice(0,5), con=connections.slice(0,5);
 let events=[...connections.slice(0,4).map(x=>({t:x.created_at,title:'Firebase connection logged',sub:x.firebase_database_url,icon:'i-db'})),...apps.slice(0,4).map(x=>({t:x.created_at,title:x.apk_stored_name?'APK registered':'App registered',sub:x.app_name,icon:'i-box'}))].sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,5);
 return `<div class="page-head"><div><h1>Welcome Back, Admin</h1><p>Everything important is visible from one control center.</p></div><div class="head-meta">${new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}<small>Live admin session</small></div></div>
 <section class="cards">${metric('Total APKs',stats.total||0,'Registered applications','purple','i-box')}${metric('Panel Connections',stats.connections||0,'Logged connection events','pink','i-users')}${metric('APK Files Stored',stats.with_apk||0,'Files available to admin','blue','i-db')}${metric('Storage Used',bytes(stats.apk_bytes),'Current APK storage','green','i-db')}</section>
 <div class="grid"><section class="panel"><div class="panel-head"><div class="title"><div class="mini"><svg><use href="#i-box"/></svg></div><h2>Upload Activity <span class="muted">(Last 7 Days)</span></h2></div><button class="link-btn" data-refresh="1">Refresh</button></div><div class="chart" id="chart"></div></section><section class="panel"><div class="panel-head"><div class="title"><div class="mini"><svg><use href="#i-log"/></svg></div><h2>Recent Activity</h2></div><button class="link-btn" data-view="activity">View All →</button></div><div class="activity">${events.length?events.map(e=>`<div class="activity-row"><div class="activity-icon"><svg><use href="#${e.icon}"/></svg></div><div class="activity-main"><b>${esc(e.title)}</b><small>${esc(e.sub)}</small></div><span class="activity-time">${esc(e.t)}</span></div>`).join(''):'<div class="empty">No recent activity.</div>'}</div></section></div>
 <div class="lower"><section class="panel"><div class="panel-head"><div class="title"><div class="mini"><svg><use href="#i-box"/></svg></div><h2>Latest APKs</h2></div><button class="link-btn" data-view="apps">View All →</button></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Name</th><th>Owner</th><th>Size</th><th>Date</th><th>Action</th></tr></thead><tbody>${recentApps.length?recentApps.map((r,i)=>`<tr><td>${i+1}</td><td><span class="strong">${esc(r.app_name)}</span><span class="meta">${esc(r.apk_original_name||'APK')}</span></td><td>${esc(r.owner_name)}<span class="meta">${esc(r.owner_email)}</span></td><td>${bytes(r.apk_size)}</td><td>${esc(r.created_at)}</td><td><button class="action" title="Details" data-detail="${r.id}"><svg><use href="#i-link"/></svg></button>${r.apk_stored_name?`<button class="action" title="Download" data-download="${r.id}"><svg><use href="#i-download"/></svg></button>`:''}<button class="action danger" title="Delete" data-delete="${r.id}"><svg><use href="#i-trash"/></svg></button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No APK records found.</div></td></tr>'}</tbody></table></div></section>
 <section class="panel"><div class="panel-head"><div class="title"><div class="mini"><svg><use href="#i-db"/></svg></div><h2>Recent Connections</h2></div><button class="link-btn" data-view="connections">View All →</button></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Type</th><th>Firebase URL</th><th>Logged</th></tr></thead><tbody>${con.length?con.map((r,i)=>`<tr><td>${i+1}</td><td>${statusBadge(r.login_type||'Connection')}</td><td><span class="strong">${esc(r.firebase_project_id||'Firebase')}</span><span class="meta">${esc(r.firebase_database_url||'')}</span></td><td>${esc(r.created_at)}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">No connections logged.</div></td></tr>'}</tbody></table></div></section></div>`;
}
function drawChart(){const el=$('#chart');if(!el)return;const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}const a=days.map(d=>apps.filter(r=>new Date(r.created_at).toDateString()===d.toDateString()).length),c=days.map(d=>connections.filter(r=>new Date(r.created_at).toDateString()===d.toDateString()).length);const W=760,H=220,L=38,R=10,T=10,B=34,max=Math.max(5,...a,...c);const x=i=>L+i*(W-L-R)/6,y=v=>T+(max-v)*(H-T-B)/max,pts=v=>v.map((n,i)=>`${x(i)},${y(n)}`).join(' '),grid=Array.from({length:5},(_,i)=>{const yy=T+i*(H-T-B)/4;return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#1a3048"/><text x="${L-8}" y="${yy+4}" fill="#6f829b" font-size="10" text-anchor="end">${Math.round(max-(max*i/4))}</text>`}).join('');const labels=days.map((d,i)=>`<text x="${x(i)}" y="${H-8}" fill="#71849c" font-size="10" text-anchor="middle">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="gc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#43b4ff" stop-opacity=".17"/><stop offset="1" stop-color="#43b4ff" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${x(0)},${H-B} ${pts(a)} ${x(6)},${H-B}" fill="url(#ga)"/><polygon points="${x(0)},${H-B} ${pts(c)} ${x(6)},${H-B}" fill="url(#gc)"/><polyline points="${pts(a)}" fill="none" stroke="#9b6bff" stroke-width="2.6"/><polyline points="${pts(c)}" fill="none" stroke="#43b4ff" stroke-width="2.4"/>${a.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="3.1" fill="#9b6bff"/>`).join('')}${c.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="3.1" fill="#43b4ff"/>`).join('')}${labels}</svg>`}
function renderApps(){const q=$('#globalSearch').value.trim().toLowerCase();const rows=apps.filter(r=>!q||[r.app_name,r.owner_name,r.owner_email,r.firebase_project_id,r.firebase_database_url].join(' ').toLowerCase().includes(q));return setView(`APK Manager`,`Manage app registrations and APK files.`,`<div class="toolbar"><input id="viewSearch" value="${esc(q)}" placeholder="Search apps, owners, projects…"><button class="btn" data-refresh="1">Refresh</button></div>`,`<section class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>App</th><th>Owner</th><th>Firebase</th><th>APK</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="strong">${esc(r.app_name)}</span><span class="meta">${esc(r.apk_original_name||'No APK')}</span></td><td>${esc(r.owner_name)}<span class="meta">${esc(r.owner_email)}</span></td><td>${esc(r.firebase_project_id||'—')}</td><td>${r.apk_stored_name?bytes(r.apk_size):'—'}</td><td>${statusBadge(r.status||'active')}</td><td><button class="action" data-detail="${r.id}"><svg><use href="#i-link"/></svg></button>${r.apk_stored_name?`<button class="action" data-download="${r.id}"><svg><use href="#i-download"/></svg></button>`:''}<button class="action danger" data-delete="${r.id}"><svg><use href="#i-trash"/></svg></button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">No matching applications.</div></td></tr>'}</tbody></table></div></section>`)}
function renderConnections(){const q=$('#globalSearch').value.trim().toLowerCase();const rows=connections.filter(r=>!q||[r.login_type,r.firebase_database_url,r.key_fingerprint,r.firebase_project_id].join(' ').toLowerCase().includes(q));return setView(`Connections`,`Panel connection records and key-presence fingerprints.`,`<div class="toolbar"><input id="viewSearch" value="${esc(q)}" placeholder="Search URL, type, fingerprint…"><button class="btn" data-refresh="1">Refresh</button></div>`,`<section class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Type</th><th>Firebase URL</th><th>Key</th><th>Logged</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.login_type)}</td><td><span class="strong">${esc(r.firebase_project_id||'Firebase')}</span><span class="meta">${esc(r.firebase_database_url)}</span></td><td>${r.key_present?'Provided':'Not provided'}<span class="meta">${esc(r.key_fingerprint||'')}</span></td><td>${esc(r.created_at)}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No connection records.</div></td></tr>'}</tbody></table></div></section>`)}
function parsePairs(text){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const pairs=[];for(const line of lines){if(line.startsWith('#'))continue; if(/^url\s*,\s*secret_key$/i.test(line))continue; const parts=line.split(','); const url=(parts[0]||'').trim(); if(!/^https:\/\//i.test(url))continue; pairs.push({url,credential:parts.slice(1).join(',').trim()})}const seen=new Set();return pairs.filter(p=>{const k=p.url.replace(/\/$/,'');if(seen.has(k))return false;seen.add(k);return true})}
function renderBulk(){clearTimeout(bulkTimer);return setView(`Bulk Firebase`,`Run persistent URL health jobs from a TXT/CSV list.`,`<div class="toolbar"><button class="btn" data-bulk-sample="1">Format example</button><button class="btn" data-refresh="1">Refresh</button></div>`,bulkShell())}
function bulkShell(){return `<div class="bulk-grid"><section class="card bulk-card"><div class="title" style="margin-bottom:12px"><div class="mini"><svg><use href="#i-db"/></svg></div><div><h2 style="margin:0;font-size:16px">Bulk checker</h2><div class="small">Accepts plain URLs or <b>URL,SECRET_KEY</b> lines. Only URLs are queued for the health worker.</div></div></div><div id="drop" class="drop"><div class="big"><svg><use href="#i-upload"/></svg></div><h3 id="fileTitle">Choose a TXT file</h3><p>One Firebase URL per line, or one URL + its corresponding key per line.</p><button class="btn" id="choose">Choose file</button><input id="bulkFile" type="file" accept=".txt,.csv,text/plain,text/csv"></div><div id="pairPreview" class="pair-preview hidden"></div><div class="format-box">URL,SECRET_KEY\nhttps://project-a-default-rtdb.firebaseio.com,key-a\nhttps://project-b-default-rtdb.firebaseio.com,key-b</div><div class="note">The uploaded file is parsed in the browser. The second column is not sent to the background worker, stored in the database, or used for authentication. The worker queues only the Firebase URLs for reachability checks.</div><div class="bulk-actions"><button class="btn primary" id="startBulk"><span class="icon"><svg><use href="#i-check"/></svg></span>Start Bulk Check</button><button class="btn" id="clearBulk">Clear</button></div></section><section class="card bulk-card"><div class="title" style="margin-bottom:12px"><div class="mini"><svg><use href="#i-log"/></svg></div><div><h2 style="margin:0;font-size:16px">Job history</h2><div class="small">Jobs continue on the server after you leave the page.</div></div></div><div id="jobs" class="jobs"><div class="empty">Loading jobs…</div></div></section></div>`}
async function initBulk(){const file=$('#bulkFile'),drop=$('#drop'),preview=$('#pairPreview'),title=$('#fileTitle'),start=$('#startBulk');if(!file)return;$('#choose').onclick=()=>file.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',ev=>{if(ev.dataTransfer.files?.[0]){file.files=ev.dataTransfer.files;file.dispatchEvent(new Event('change'))}});file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;const txt=await f.text();const pairs=parsePairs(txt);title.textContent=`${f.name} · ${pairs.length} URL(s)`;preview.innerHTML=pairs.slice(0,80).map(p=>`<div class="pair-row"><span>${esc(p.url)}</span><span>${p.credential?'corresponding key present':'no key column'}</span></div>`).join('')+(pairs.length>80?`<div class="pair-row"><span>+ ${pairs.length-80} more</span><span>preview truncated</span></div>`:'');preview.classList.toggle('hidden',!pairs.length);start.disabled=!pairs.length});$('#clearBulk').onclick=()=>{file.value='';title.textContent='Choose a TXT file';preview.classList.add('hidden');start.disabled=false};start.onclick=async()=>{const f=file.files?.[0];if(!f)return toast('Choose a TXT/CSV file first','error');const txt=await f.text();const pairs=parsePairs(txt);const urls=pairs.map(p=>p.url);if(!urls.length)return toast('No valid HTTPS Firebase URLs were found','error');start.disabled=true;try{const r=await api('/api/bulk-firebase/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,urls})});toast(`Bulk job #${r.job_id} queued for ${r.total} URL(s)`,'success');await openBulkJob(r.job_id)}catch(e){toast(e.message,'error')}finally{start.disabled=false}};await loadBulkJobs()}
async function loadBulkJobs(){const box=$('#jobs');if(!box)return;try{const r=await api('/api/bulk-firebase/jobs');const jobs=r.jobs||[];box.innerHTML=jobs.length?jobs.map(j=>`<div class="job"><div><b>Job #${j.id} · ${esc(j.filename)}</b><small>${j.processed}/${j.total} processed · ${j.active} reachable · ${j.inactive} not reachable</small></div><div class="job-right">${statusPill(j.status)}<div style="margin-top:7px"><button class="action" data-job="${j.id}" title="View job"><svg><use href="#i-link"/></svg></button></div></div></div>`).join(''):'<div class="empty">No bulk jobs yet.</div>';box.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>openBulkJob(Number(b.dataset.job)))}catch(e){box.innerHTML='<div class="empty">Unable to load jobs.</div>'}}
function statusPill(s){return `<span class="status-pill ${String(s||'').toLowerCase()}">${esc(s||'unknown')}</span>`}
async function openBulkJob(id){try{const r=await api(`/api/bulk-firebase/jobs/${id}`);currentJob=id;const j=r.job,items=r.items||[],pct=j.total?Math.round(j.processed/j.total*100):0;setView(`Bulk Job #${j.id}`,`${j.filename} · ${statusPill(j.status)}`,`<div class="toolbar"><button class="btn" data-view="bulk">Back</button><button class="btn" data-export="${j.id}">Export CSV</button>${['pending','processing'].includes(j.status)?`<button class="btn danger" data-cancel="${j.id}">Cancel Job</button>`:''}</div>`,`<section class="card bulk-card"><div class="bulk-stats"><div class="bulk-stat"><label>Total</label><strong>${j.total}</strong></div><div class="bulk-stat"><label>Processed</label><strong>${j.processed}</strong></div><div class="bulk-stat"><label>Reachable</label><strong>${j.active}</strong></div><div class="bulk-stat"><label>Not reachable</label><strong>${j.inactive}</strong></div><div class="bulk-stat"><label>Progress</label><strong>${pct}%</strong></div></div><div class="progress"><i style="width:${pct}%"></i></div></section><section class="card bulk-card" style="margin-top:16px"><div class="title" style="margin-bottom:12px"><div class="mini"><svg><use href="#i-db"/></svg></div><div><h2 style="margin:0;font-size:16px">Results</h2><div class="small">HTTP-level status only; no credentials are used by the worker.</div></div></div><div class="results"><table class="table"><thead><tr><th>#</th><th>Firebase URL</th><th>Status</th><th>HTTP</th><th>Details</th><th>Checked</th></tr></thead><tbody>${items.length?items.map((x,i)=>`<tr><td>${i+1}</td><td class="url">${esc(x.url)}</td><td>${statusBadge(x.status)}</td><td>${x.http_status||'—'}</td><td>${esc(x.error||'—')}</td><td>${esc(x.checked_at||'—')}</td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No results yet.</div></td></tr>'}</tbody></table></div></section>`);if(['pending','processing'].includes(j.status)){clearTimeout(bulkTimer);bulkTimer=setTimeout(()=>openBulkJob(id),1800)}}catch(e){toast(e.message,'error')}}

function downloadSample(){const txt='URL,SECRET_KEY\nhttps://project-a-default-rtdb.firebaseio.com,key-a\nhttps://project-b-default-rtdb.firebaseio.com,key-b\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='firebase_bulk_example.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Example TXT downloaded','success')}
function statusBadge2(s){return statusBadge(s)}
function exportJob(id){api(`/api/bulk-firebase/jobs/${id}`).then(r=>{const rows=[['URL','Status','HTTP Status','Details','Checked At'],...(r.items||[]).map(x=>[x.url,x.status,x.http_status||'',x.error||'',x.checked_at||''])];const csv=rows.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`bulk-firebase-job-${id}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}).catch(e=>toast(e.message,'error'))}
async function cancelJob(id){if(!confirm(`Cancel bulk job #${id}?`))return;try{await api(`/api/bulk-firebase/jobs/${id}/cancel`,{method:'POST'});toast('Job cancelled','success');await openBulkJob(id)}catch(e){toast(e.message,'error')}}
function renderFirebase(){const q=$('#globalSearch').value.trim().toLowerCase();const rows=apps.filter(r=>!q||[r.app_name,r.firebase_project_id,r.firebase_database_url,r.firebase_auth_domain,r.firebase_storage_bucket,r.firebase_app_id].join(' ').toLowerCase().includes(q));return setView('Firebase Data','Submitted Firebase project metadata.','<div class="toolbar"><input id="viewSearch" value="'+esc(q)+'" placeholder="Search project, URL, app ID…"><button class="btn" data-refresh="1">Refresh</button></div>',`<section class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>App</th><th>Project</th><th>Database URL</th><th>Auth Domain</th><th>Storage</th><th>App ID</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td class="strong">${esc(r.app_name)}</td><td>${esc(r.firebase_project_id||'—')}</td><td class="url">${esc(r.firebase_database_url||'—')}</td><td>${esc(r.firebase_auth_domain||'—')}</td><td>${esc(r.firebase_storage_bucket||'—')}</td><td>${esc(r.firebase_app_id||'—')}</td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No Firebase metadata records.</div></td></tr>'}</tbody></table></div></section>`)}
function renderActivity(){const events=[...apps.map(r=>({t:r.created_at,type:r.apk_stored_name?'APK registered':'App registered',s:r.app_name})),...connections.map(r=>({t:r.created_at,type:'Firebase connection logged',s:r.firebase_database_url}))].sort((a,b)=>String(b.t).localeCompare(String(a.t)));return setView('Activity Logs','Recent admin-visible events.','<div class="toolbar"><button class="btn" data-refresh="1">Refresh</button></div>',`<section class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead><tbody>${events.length?events.map(e=>`<tr><td>${esc(e.t)}</td><td>${esc(e.type)}</td><td class="url">${esc(e.s)}</td></tr>`).join(''):'<tr><td colspan="3"><div class="empty">No activity yet.</div></td></tr>'}</tbody></table></div></section>`)}
function renderSettings(){return setView('Storage & Settings','Runtime configuration and persistence overview.','<div class="toolbar"><button class="btn" data-refresh="1">Refresh</button></div>','<section class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+metric('Data Directory','DATA_DIR','SQLite + APK files persist here','purple','i-db')+metric('Max APK Size',(stats.max_apk_mb||150)+' MB','Server upload limit','blue','i-box')+metric('Session','12 hours','HttpOnly + SameSite cookie','green','i-settings')+metric('Bulk Queue',stats.bulk_running||0,'Pending/processing jobs','pink','i-log')+'</section>')}
function renderProfile(){return setView('Admin Profile','Current administrator session and security posture.','<div class="toolbar"><button class="btn danger" data-logout="1">Sign out</button></div>','<section class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+metric('Account','Admin','Super Admin','purple','i-user')+metric('Session','Protected','Server-side session cookie','green','i-check')+metric('Credentials','Not displayed','Password never shown in dashboard','blue','i-settings')+metric('Theme',document.body.classList.contains('light')?'Light':'Dark','Stored locally','pink','i-sun')+'</section>')}
function setView(title,sub,tools,body){$('#content').innerHTML=`<div class="view-head"><div><h2>${title}</h2><p>${sub}</p></div>${tools||''}</div>${body}`;bindViewEvents();return ''}
async function renderView(){clearTimeout(bulkTimer);if(view==='dashboard'){const html=renderDashboard();$('#content').innerHTML=html;drawChart();bindViewEvents();return}if(view==='apps'){renderApps();return}if(view==='connections'){renderConnections();return}if(view==='bulk'){renderBulk();await initBulk();return}if(view==='firebase'){renderFirebase();return}if(view==='activity'){renderActivity();return}if(view==='settings'){renderSettings();return}if(view==='profile'){renderProfile();return}}
function bindViewEvents(){$$('[data-view]').forEach(b=>b.onclick=()=>navTo(b.dataset.view));$$('[data-refresh]').forEach(b=>b.onclick=()=>loadAll());$$('[data-detail]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.detail)));$$('[data-download]').forEach(b=>b.onclick=()=>location.href='/api/apk/'+b.dataset.download);$$('[data-delete]').forEach(b=>b.onclick=()=>deleteApp(Number(b.dataset.delete)));$$('[data-bulk-sample]').forEach(b=>b.onclick=downloadSample);$$('[data-job]').forEach(b=>b.onclick=()=>openBulkJob(Number(b.dataset.job)));$$('[data-export]').forEach(b=>b.onclick=()=>exportJob(Number(b.dataset.export)));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelJob(Number(b.dataset.cancel)));$$('[data-logout]').forEach(b=>b.onclick=()=>logout());$('#viewSearch')?.addEventListener('input',e=>{const q=e.target.value;$('#globalSearch').value=q;renderView()});}
function openDetail(id){const r=apps.find(x=>Number(x.id)===id);if(!r)return;$('#drawerTitle').textContent=r.app_name||'Details';$('#drawerBody').innerHTML=Object.entries({'Owner':r.owner_name,'Email':r.owner_email,'Project ID':r.firebase_project_id||'—','Database URL':r.firebase_database_url||'—','Auth Domain':r.firebase_auth_domain||'—','Storage Bucket':r.firebase_storage_bucket||'—','App ID':r.firebase_app_id||'—','APK':r.apk_original_name||'No APK','APK Size':r.apk_size?bytes(r.apk_size):'—','SHA-256':r.apk_sha256||'—','Created':r.created_at}).map(([k,v])=>`<div class="detail-row"><label>${esc(k)}</label><div>${esc(v)}</div></div>`).join('');$('#drawer').classList.add('show');$('#drawer').setAttribute('aria-hidden','false')}
function closeDrawer(){$('#drawer').classList.remove('show');$('#drawer').setAttribute('aria-hidden','true')}
async function deleteApp(id){if(!confirm('Delete this app record and its APK?'))return;try{await api('/api/apps/'+id+'/delete',{method:'DELETE'});toast('Record deleted','success');await loadAll()}catch(e){toast(e.message,'error')}}
async function loadAll(){try{const [a,s,c]=await Promise.all([api('/api/apps'),api('/api/admin/stats'),api('/api/panel-connections')]);apps=a.apps||[];stats=s||{};connections=c.connections||[];$('#sideStorage').textContent=bytes(stats.apk_bytes||0)+' current usage';$('#storageBar').style.width=Math.min(100,Number(stats.apk_bytes||0)/(Number(stats.max_apk_mb||150)*1024*1024)*100)+'%';$('#sideMax').textContent=(stats.max_apk_mb||150)+' MB';$('#noticeCount').textContent=Math.min(99,(connections.length+(stats.bulk_running||0)));await renderView()}catch(e){toast(e.message,'error')}}
async function login(){const err=$('#loginErr');err.textContent='';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');await loadAll()}catch(e){err.textContent=e.message}}
async function logout(){await api('/api/admin/logout',{method:'POST'}).catch(()=>{});$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')}
$('#login').onclick=login;$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#logout').onclick=logout;$('#profileBtn').onclick=()=>navTo('profile');$('#notice').onclick=()=>navTo('activity');$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#drawerClose').onclick=closeDrawer;$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer'))closeDrawer()});$('#globalSearch').addEventListener('input',()=>{if(['apps','connections','firebase'].includes(view))renderView()});$('#themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('berlin_admin_theme',document.body.classList.contains('light')?'light':'dark');renderView()};$$('.nav-btn').forEach(b=>b.onclick=()=>navTo(b.dataset.view));if(localStorage.getItem('berlin_admin_theme')==='light')document.body.classList.add('light');
new URLSearchParams(location.search).get('section')&&(()=>{const s=new URLSearchParams(location.search).get('section');if(['bulk','apps','connections','firebase','activity','settings','profile'].includes(s))view=s})();
// Show login first; if the page was opened with a deep-link the selected view is applied after auth.
</script>
</body>
</html>
